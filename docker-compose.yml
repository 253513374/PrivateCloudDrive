services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PrivateCloudDrive}
      POSTGRES_USER: ${POSTGRES_USER:-privateclouddrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privateclouddrive}
    ports:
      - "5432:5432"
    volumes:
      - privateclouddrive_stack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-privateclouddrive} -d ${POSTGRES_DB:-PrivateCloudDrive}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - privateclouddrive_stack_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["dotnet", "/app/migrator/PrivateCloudDrive.DbMigrator.dll"]
    entrypoint: []
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-PrivateCloudDrive};Username=${POSTGRES_USER:-privateclouddrive};Password=${POSTGRES_PASSWORD:-privateclouddrive};"
      Redis__Configuration: "redis:6379"
      StringEncryption__DefaultPassPhrase: ${STRING_ENCRYPTION_PASSPHRASE:-change-this-32-character-secret}
      OpenIddict__Applications__PrivateCloudDrive_Swagger__RootUrl: ${PUBLIC_URL:-http://localhost:8080}
      OpenIddict__Applications__PrivateCloudDrive_App__RedirectUri: "privateclouddrive://callback"
      OpenIddict__Applications__PrivateCloudDrive_App__PostLogoutRedirectUri: "privateclouddrive://callback"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-PrivateCloudDrive};Username=${POSTGRES_USER:-privateclouddrive};Password=${POSTGRES_PASSWORD:-privateclouddrive};"
      Redis__Configuration: "redis:6379"
      App__SelfUrl: ${PUBLIC_URL:-http://localhost:8080}
      App__CorsOrigins: ${PUBLIC_URL:-http://localhost:8080}
      AuthServer__Authority: ${PUBLIC_URL:-http://localhost:8080}
      AuthServer__RequireHttpsMetadata: ${AUTH_SERVER_REQUIRE_HTTPS_METADATA:-true}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Security__AllowInsecureTransportForLocalValidation: ${ALLOW_INSECURE_LOCAL_VALIDATION:-false}
      Security__PublicSharePasswordRateLimit__PermitLimit: ${PUBLIC_SHARE_PASSWORD_RATE_LIMIT_PERMIT_LIMIT:-10}
      Security__PublicSharePasswordRateLimit__WindowMinutes: ${PUBLIC_SHARE_PASSWORD_RATE_LIMIT_WINDOW_MINUTES:-10}
      FileCenter__StorageProvider: ${FILECENTER_STORAGE_PROVIDER:-FileSystem}
      FileCenter__StorageRootPath: ${FILECENTER_STORAGE_PATH:-/app/storage}
      FileCenter__AliyunOss__AccessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      FileCenter__AliyunOss__AccessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      FileCenter__AliyunOss__Endpoint: ${ALIYUN_OSS_ENDPOINT:-}
      FileCenter__AliyunOss__RegionId: ${ALIYUN_OSS_REGION_ID:-}
      FileCenter__AliyunOss__BucketName: ${ALIYUN_OSS_BUCKET:-}
      FileCenter__AliyunOss__CreateBucketIfNotExists: ${ALIYUN_OSS_CREATE_BUCKET:-false}
      FileCenter__MediaProcessing__FfprobePath: "ffprobe"
      FileCenter__MediaProcessing__FfmpegPath: "ffmpeg"
      FileCenter__MediaProcessing__VideoThumbnailWidth: "320"
      BackgroundJobs__IsJobExecutionEnabled: "false"
      StringEncryption__DefaultPassPhrase: ${STRING_ENCRYPTION_PASSPHRASE:-change-this-32-character-secret}
      MobileAuth__LoginRateLimit__EnablePasswordLoginRateLimit: ${PASSWORD_LOGIN_RATE_LIMIT_ENABLED:-true}
      MobileAuth__LoginRateLimit__MaxFailedAttempts: ${PASSWORD_LOGIN_RATE_LIMIT_MAX_FAILED_ATTEMPTS:-5}
      MobileAuth__LoginRateLimit__WindowMinutes: ${PASSWORD_LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      Authentication__WeChat__Enabled: ${WECHAT_ENABLED:-false}
      Authentication__WeChat__AppId: ${WECHAT_APP_ID:-}
      Authentication__WeChat__AppSecret: ${WECHAT_APP_SECRET:-}
      Authentication__WeChat__Scope: ${WECHAT_SCOPE:-snsapi_userinfo}
      Authentication__WeChat__CallbackScheme: ${WECHAT_CALLBACK_SCHEME:-privateclouddrive}
      Authentication__WeChat__Android__PackageName: ${WECHAT_ANDROID_PACKAGE_NAME:-com.companyname.privateclouddrive.app}
      Authentication__WeChat__Android__Signature: ${WECHAT_ANDROID_SIGNATURE:-}
      Authentication__WeChat__iOS__BundleId: ${WECHAT_IOS_BUNDLE_ID:-com.companyname.privateclouddrive.app}
      Authentication__WeChat__iOS__UrlScheme: ${WECHAT_IOS_URL_SCHEME:-}
      Authentication__WeChat__BindingTicketLifetimeMinutes: ${WECHAT_BINDING_TICKET_LIFETIME_MINUTES:-5}
      Authentication__WeChat__RequestTimeoutSeconds: ${WECHAT_REQUEST_TIMEOUT_SECONDS:-10}
      Authentication__WeChat__RateLimitWindowSeconds: ${WECHAT_RATE_LIMIT_WINDOW_SECONDS:-300}
      Authentication__WeChat__RateLimitMaxAttempts: ${WECHAT_RATE_LIMIT_MAX_ATTEMPTS:-60}
      Authentication__External__BindingTicketLifetimeMinutes: ${EXTERNAL_BINDING_TICKET_LIFETIME_MINUTES:-5}
      Authentication__External__RequestTimeoutSeconds: ${EXTERNAL_REQUEST_TIMEOUT_SECONDS:-10}
      Authentication__External__RateLimitWindowSeconds: ${EXTERNAL_RATE_LIMIT_WINDOW_SECONDS:-300}
      Authentication__External__RateLimitMaxAttempts: ${EXTERNAL_RATE_LIMIT_MAX_ATTEMPTS:-60}
      Authentication__External__Google__Enabled: ${GOOGLE_LOGIN_ENABLED:-false}
      Authentication__External__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__External__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__External__Google__RedirectUri: ${GOOGLE_REDIRECT_URI:-privateclouddrive://callback}
      Authentication__External__Google__Scope: ${GOOGLE_SCOPE:-openid profile email}
      Authentication__External__Google__UsePkce: ${GOOGLE_USE_PKCE:-true}
      Authentication__External__GitHub__Enabled: ${GITHUB_LOGIN_ENABLED:-false}
      Authentication__External__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__External__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Authentication__External__GitHub__RedirectUri: ${GITHUB_REDIRECT_URI:-privateclouddrive://callback}
      Authentication__External__GitHub__Scope: ${GITHUB_SCOPE-}
      Authentication__External__GitHub__UsePkce: ${GITHUB_USE_PKCE:-true}
    ports:
      - "8080:8080"
    volumes:
      - privateclouddrive_stack_storage:/app/storage
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-PrivateCloudDrive};Username=${POSTGRES_USER:-privateclouddrive};Password=${POSTGRES_PASSWORD:-privateclouddrive};"
      Redis__Configuration: "redis:6379"
      AuthServer__Authority: ${PUBLIC_URL:-http://localhost:8080}
      AuthServer__RequireHttpsMetadata: ${AUTH_SERVER_REQUIRE_HTTPS_METADATA:-true}
      Security__AllowInsecureTransportForLocalValidation: ${ALLOW_INSECURE_LOCAL_VALIDATION:-false}
      FileCenter__StorageProvider: ${FILECENTER_STORAGE_PROVIDER:-FileSystem}
      FileCenter__StorageRootPath: ${FILECENTER_STORAGE_PATH:-/app/storage}
      FileCenter__AliyunOss__AccessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      FileCenter__AliyunOss__AccessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      FileCenter__AliyunOss__Endpoint: ${ALIYUN_OSS_ENDPOINT:-}
      FileCenter__AliyunOss__RegionId: ${ALIYUN_OSS_REGION_ID:-}
      FileCenter__AliyunOss__BucketName: ${ALIYUN_OSS_BUCKET:-}
      FileCenter__AliyunOss__CreateBucketIfNotExists: ${ALIYUN_OSS_CREATE_BUCKET:-false}
      FileCenter__MediaProcessing__FfprobePath: "ffprobe"
      FileCenter__MediaProcessing__FfmpegPath: "ffmpeg"
      FileCenter__MediaProcessing__VideoThumbnailWidth: "320"
      BackgroundJobs__IsJobExecutionEnabled: "true"
      StringEncryption__DefaultPassPhrase: ${STRING_ENCRYPTION_PASSPHRASE:-change-this-32-character-secret}
    volumes:
      - privateclouddrive_stack_storage:/app/storage
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-privateclouddrive}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-privateclouddrive}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - privateclouddrive_stack_minio_data:/data

volumes:
  privateclouddrive_stack_postgres_data:
  privateclouddrive_stack_redis_data:
  privateclouddrive_stack_storage:
  privateclouddrive_stack_minio_data:

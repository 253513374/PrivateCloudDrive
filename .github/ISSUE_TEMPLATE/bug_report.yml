name: Bug report
说明: 报告可复现缺陷
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 简要说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请列出可复现步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows / Android / Docker / .NET SDK / commit
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请勿粘贴真实密钥、Token、用户文件内容。

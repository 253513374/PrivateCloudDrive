name: Security Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-evidence-sensitive-data:
    name: Validation evidence sensitive-data gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout without repository token
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:${GITHUB_REF}" || \
            git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}" || git checkout --detach FETCH_HEAD

      - name: Verify Python runtime
        run: python3 --version

      - name: Run validation evidence sensitive-data gate
        run: |
          python3 scripts/validation_evidence_index.py \
            --run-id "github-${{ github.run_id }}" \
            --date "$(date -u +%Y%m%d)"

      - name: Upload validation evidence gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-evidence-sensitive-data-gate-${{ github.run_id }}
          path: docs/validation/daily-acceptance-*github-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
